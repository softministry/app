server:
  port: 8080

spring:
  config:
    import:
      - optional:file:${user.home}/ChurchAdministrationPlatform/config/runtime-mode.properties
  main:
    headless: false
  datasource:
    url: jdbc:sqlite:${ministryadmin.desktop.database-file-base}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  flyway:
    enabled: false
  thymeleaf:
    mode: HTML
    cache: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.type: TRACE
    org.springframework.jdbc.core: TRACE
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE

theme:
  app:
    title: "Church Administration Platform"

ministryadmin:
  desktop:
    base-url: ${app.base-url:http://localhost}
    runtime-mode: prod
    home-dir: ${user.home}/ChurchAdministrationPlatform
    data-dir: ${ministryadmin.desktop.home-dir}/data
    uploads-dir: ${ministryadmin.desktop.home-dir}/uploads
    backups-dir: ${ministryadmin.desktop.home-dir}/backups
    logs-dir: ${ministryadmin.desktop.home-dir}/logs
    database-file-base: ${ministryadmin.desktop.data-dir}/ministryadmin.sqlite.db
    open-browser-on-start: true
    startup-path: /dashboard
    keep-in-dock: true
    control-window:
      enabled: true
    shutdown:
      enabled: true
    backup:
      enabled: true
      initial-delay-ms: 120000
      interval-ms: 86400000
      retention-days: 30
