<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>Resetare parolă</title>
  <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
</head>
<body>
<div class="page-shell page-shell-auth">
  <section class="card auth-card">
    <div class="section-heading">
      <div>
        <p class="eyebrow">Church Administration Platform</p>
        <h1>Resetare parolă</h1>
      </div>
    </div>

    <section th:if="${error}" class="flash flash-error" th:text="${error}">
      Date invalide pentru resetare.
    </section>

    <form method="post" th:action="@{/forgot-password}" th:object="${resetForm}" class="event-form">
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <label>
        <span>Username</span>
        <input type="text" th:field="*{username}" autocomplete="username" required />
      </label>
      <label>
        <span th:text="${questionOne}">Întrebarea 1</span>
        <input type="text" th:field="*{answerOne}" autocomplete="off" required />
      </label>
      <label>
        <span th:text="${questionTwo}">Întrebarea 2</span>
        <input type="text" th:field="*{answerTwo}" autocomplete="off" required />
      </label>
      <label>
        <span>Parolă nouă</span>
        <input type="password" th:field="*{newPassword}" autocomplete="new-password" required />
      </label>
      <label>
        <span>Confirmă parola nouă</span>
        <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required />
      </label>
      <div class="form-actions">
        <button type="submit" class="button primary">Resetează parola</button>
        <a th:href="@{/login}" class="link-button">Înapoi la login</a>
      </div>
    </form>
  </section>
</div>
</body>
</html>
