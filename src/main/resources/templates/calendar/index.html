<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro" data-theme="light" th:attr="data-ui-theme=${headerUiTheme}">
<head>
  <meta charset="UTF-8" />
  <title th:text="${(headerActiveChurch != null and headerActiveChurch.name != null and !#strings.isEmpty(headerActiveChurch.name) ? headerActiveChurch.name + ' · ' : '') + 'Calendar evenimente'}">Calendar evenimente</title>
  <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
</head>
<body>
<div class="page-shell calendar-page">
  <header class="page-header">
    <div>
      <h1 data-i18n="calendar.title">Calendar</h1>
    </div>
    <div class="header-actions">
      <nav th:replace="~{fragments/layout :: mainNav}"></nav>
      <form th:replace="~{fragments/layout :: churchSwitcher}"></form>
      <a th:href="@{/events/new}" class="button primary header-action-icon" aria-label="Adaugă eveniment" title="Adaugă eveniment" data-i18n-aria-label="calendar.addEvent" data-i18n-title="calendar.addEvent">
        <span class="material-icons" aria-hidden="true">add</span>
      </a>
      <button th:replace="~{fragments/layout :: themeToggle}"></button>
      <details th:replace="~{fragments/layout :: adminMenu}"></details>
    </div>
  </header>

  <section class="calendar-toolbar">
    <div class="calendar-nav">
      <a class="link-button" th:href="@{/calendar(year=${prevYear},month=${prevMonth})}" data-i18n="calendar.prevMonth">Luna anterioară</a>
      <h2 th:text="${monthLabel}">Aprilie 2026</h2>
      <a class="link-button" th:href="@{/calendar(year=${nextYear},month=${nextMonth})}" data-i18n="calendar.nextMonth">Luna următoare</a>
    </div>
    <a class="button ghost" th:href="@{|/calendar?year=${todayYear}&month=${todayMonth}#today-cell|}" data-i18n="calendar.today">Astăzi</a>
  </section>

  <section class="calendar-grid">
    <div class="calendar-weekday" data-i18n="calendar.weekdayMon">Luni</div>
    <div class="calendar-weekday" data-i18n="calendar.weekdayTue">Marți</div>
    <div class="calendar-weekday" data-i18n="calendar.weekdayWed">Miercuri</div>
    <div class="calendar-weekday" data-i18n="calendar.weekdayThu">Joi</div>
    <div class="calendar-weekday" data-i18n="calendar.weekdayFri">Vineri</div>
    <div class="calendar-weekday" data-i18n="calendar.weekdaySat">Sâmbătă</div>
    <div class="calendar-weekday" data-i18n="calendar.weekdaySun">Duminică</div>

    <th:block th:each="week : ${weeks}">
      <article th:each="day : ${week.days}"
               class="calendar-cell"
               th:classappend="${day.inCurrentMonth} ? '' : ' is-outside'"
               th:attr="id=${day.today} ? 'today-cell' : null, data-create-url=@{/events/new(openDate=${day.date})}">
        <header class="calendar-cell-header">
          <span class="calendar-day-number" th:classappend="${day.today} ? ' is-today' : ''"
                th:text="${#temporals.day(day.date)}">1</span>
        </header>
        <div class="calendar-events">
          <a th:each="occurrence : ${day.events}"
             th:href="@{'/events/' + ${occurrence.event.id} + '/edit'}"
             th:attr="data-delete-url=@{'/events/' + ${occurrence.event.id} + '/delete'}"
             class="calendar-event-card"
             th:classappend="${occurrence.event.priority != null} ? ' priority-' + ${#strings.toLowerCase(occurrence.event.priority)} : ''"
             th:title="${occurrence.event.eventName + (occurrence.event.implementedBy != null ? ' • ' + occurrence.event.implementedBy.fullName : '')}">
            <strong class="event-name" th:text="${occurrence.event.eventName}">Eveniment</strong>
            <span th:text="${occurrence.event.implementedBy != null ? occurrence.event.implementedBy.fullName : 'Fără responsabil'}">Responsabil</span>
          </a>
        </div>
      </article>
    </th:block>
  </section>
</div>
<div id="calendar-event-context-menu" class="calendar-context-menu" hidden>
  <button type="button" class="calendar-context-menu-edit">Modifică</button>
  <div class="calendar-context-menu-separator" aria-hidden="true"></div>
  <button type="button" class="calendar-context-menu-delete">Șterge</button>
</div>
<script>
  (function () {
    const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content') || '';
    const csrfParam = document.querySelector('meta[name="_csrf_parameter"]')?.getAttribute('content') || '_csrf';
    const contextMenu = document.getElementById('calendar-event-context-menu');
    const contextEditBtn = contextMenu ? contextMenu.querySelector('.calendar-context-menu-edit') : null;
    const contextDeleteBtn = contextMenu ? contextMenu.querySelector('.calendar-context-menu-delete') : null;
    let selectedEditUrl = null;
    let selectedDeleteUrl = null;

    function hideContextMenu() {
      if (!contextMenu) return;
      contextMenu.hidden = true;
      selectedEditUrl = null;
      selectedDeleteUrl = null;
    }

    function placeContextMenu(anchorElement) {
      if (!contextMenu) return;
      const padding = 10;
      const offset = 6;
      contextMenu.style.left = '0px';
      contextMenu.style.top = '0px';
      contextMenu.hidden = false;

      const menuWidth = contextMenu.offsetWidth;
      const menuHeight = contextMenu.offsetHeight;
      const rect = anchorElement.getBoundingClientRect();
      const preferredTop = window.scrollY + rect.bottom + offset;

      const maxLeft = window.scrollX + window.innerWidth - menuWidth - padding;
      const preferredLeft = window.scrollX + rect.left + 10;
      const left = Math.max(window.scrollX + padding, Math.min(preferredLeft, maxLeft));
      const top = Math.max(window.scrollY + padding, preferredTop);

      contextMenu.style.left = left + 'px';
      contextMenu.style.top = top + 'px';
    }

    function submitDelete(url) {
      if (!url) return;
      if (!window.confirm('Sigur vrei să ștergi acest eveniment?')) return;
      const currentPath = window.location.pathname + window.location.search + window.location.hash;
      const form = document.createElement('form');
      form.method = 'post';
      form.action = url;
      const redirectInput = document.createElement('input');
      redirectInput.type = 'hidden';
      redirectInput.name = 'redirect';
      redirectInput.value = currentPath;
      form.appendChild(redirectInput);
      if (csrfToken) {
        const csrfInput = document.createElement('input');
        csrfInput.type = 'hidden';
        csrfInput.name = csrfParam;
        csrfInput.value = csrfToken;
        form.appendChild(csrfInput);
      }
      document.body.appendChild(form);
      form.submit();
    }

    if (window.location.hash === '#today-cell') {
      const todayCell = document.getElementById('today-cell');
      if (todayCell) {
        requestAnimationFrame(() => {
          todayCell.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
        });
      }
    }

    const cells = document.querySelectorAll('.calendar-cell[data-create-url]');
    cells.forEach((cell) => {
      cell.addEventListener('click', (event) => {
        hideContextMenu();
        if (event.target.closest('a.calendar-event-card')) {
          return;
        }
        const createUrl = cell.getAttribute('data-create-url');
        if (createUrl) {
          window.location.href = createUrl;
        }
      });
    });

    const eventCards = document.querySelectorAll('.calendar-event-card[data-delete-url]');
    eventCards.forEach((card) => {
      card.addEventListener('contextmenu', (event) => {
        if (!contextMenu) return;
        event.preventDefault();
        selectedEditUrl = card.getAttribute('href');
        selectedDeleteUrl = card.getAttribute('data-delete-url');
        placeContextMenu(card);
      });
    });

    if (contextEditBtn) {
      contextEditBtn.addEventListener('click', () => {
        const url = selectedEditUrl;
        hideContextMenu();
        if (url) {
          window.location.href = url;
        }
      });
    }

    if (contextDeleteBtn) {
      contextDeleteBtn.addEventListener('click', () => {
        const url = selectedDeleteUrl;
        hideContextMenu();
        submitDelete(url);
      });
    }

    document.addEventListener('click', hideContextMenu);
    document.addEventListener('scroll', hideContextMenu, true);
    window.addEventListener('resize', hideContextMenu);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        hideContextMenu();
      }
    });
  })();
</script>
  <th:block th:replace="~{fragments/layout :: fontCustomization}"></th:block>
</body>
</html>
