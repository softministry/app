<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro" data-theme="light" th:attr="data-ui-theme=${headerUiTheme}">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="account.pageTitle">Schimbă parola</title>
  <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
</head>
<body>
<div class="page-shell">
  <header class="page-header">
    <div>
      <p class="eyebrow" data-i18n="account.eyebrow">Cont</p>
      <h1 data-i18n="account.pageTitle">Schimbă parola</h1>
    </div>
    <div class="header-actions">
      <nav th:replace="~{fragments/layout :: mainNav}"></nav>
      <form th:replace="~{fragments/layout :: churchSwitcher}"></form>
      <button th:replace="~{fragments/layout :: themeToggle}"></button>
      <details th:replace="~{fragments/layout :: adminMenu}"></details>
    </div>
  </header>

  <section th:if="${success}" class="flash flash-success" th:text="${success}"></section>
  <section th:if="${error}" class="flash flash-error" th:text="${error}"></section>

  <div class="card-grid account-password-stack">
    <section class="card auth-card">
      <div class="section-heading">
        <div>
          <h2 data-i18n="account.passwordSectionTitle">Parolă cont</h2>
          <p class="muted"
             th:attr="data-i18n=${requireCurrentPassword} ? 'account.passwordHintUpdate' : 'account.passwordHintSet'">
            Actualizează parola de autentificare.
          </p>
        </div>
      </div>
      <form method="post" th:action="@{/account/password}" th:object="${passwordForm}" class="event-form account-event-form">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label th:if="${requireCurrentPassword}">
          <span data-i18n="account.currentPasswordLabel">Parola curentă</span>
          <input type="password" th:field="*{currentPassword}" autocomplete="current-password" th:required="${requireCurrentPassword}" />
        </label>
        <label>
          <span data-i18n="account.newPasswordLabel">Parolă nouă</span>
          <input type="password" th:field="*{newPassword}" autocomplete="new-password" required />
        </label>
        <label>
          <span data-i18n="account.confirmPasswordLabel">Confirmă parola nouă</span>
          <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required />
        </label>
        <div class="form-actions account-form-actions">
          <button type="submit" class="button primary"
                  th:attr="data-i18n=${requireCurrentPassword} ? 'account.submitUpdate' : 'account.submitSet'">
            Actualizează parola
          </button>
        </div>
      </form>
    </section>

    <section class="card auth-card">
      <div class="section-heading">
        <div>
          <h2 data-i18n="account.securityQuestionsTitle">Security Questions</h2>
          <p class="muted" data-i18n="account.securityQuestionsHint">Completează sau actualizează răspunsurile pentru resetare parolă.</p>
        </div>
      </div>
      <form method="post" th:action="@{/account/security-questions}" th:object="${securityForm}" class="event-form account-event-form">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label>
          <span data-i18n="account.currentPasswordLabel">Parola curentă</span>
          <input type="password" th:field="*{currentPassword}" autocomplete="current-password" required />
        </label>
        <label>
          <span data-i18n="account.securityQuestionOne">Întrebarea 1</span>
          <input type="text" th:field="*{answerOne}" autocomplete="off" required />
        </label>
        <label>
          <span data-i18n="account.securityQuestionTwo">Întrebarea 2</span>
          <input type="text" th:field="*{answerTwo}" autocomplete="off" required />
        </label>
        <div class="form-actions account-form-actions">
          <button type="submit" class="button primary" data-i18n="account.saveSecurityQuestions">Salvează întrebările</button>
        </div>
      </form>
    </section>
  </div>
</div>
</body>
</html>
