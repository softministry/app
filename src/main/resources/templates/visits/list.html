<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro" data-theme="light" th:attr="data-ui-theme=${headerUiTheme}">
<head>
  <meta charset="UTF-8" />
  <title th:text="${(headerActiveChurch != null and headerActiveChurch.name != null and !#strings.isEmpty(headerActiveChurch.name) ? headerActiveChurch.name + ' · ' : '') + 'Vizite'}">Vizite</title>
  <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
</head>
<body>
<div class="page-shell">
  <header class="page-header">
    <div>
      <h1>Vizite</h1>
    </div>
    <div class="header-actions">
      <nav th:replace="~{fragments/layout :: mainNav}"></nav>
      <form th:replace="~{fragments/layout :: churchSwitcher}"></form>
      <a th:href="@{/visits/new}" class="button primary header-action-icon" aria-label="Adaugă vizită" title="Adaugă vizită">
        <span class="material-icons" aria-hidden="true">add_location_alt</span>
      </a>
      <button th:replace="~{fragments/layout :: themeToggle}"></button>
      <details th:replace="~{fragments/layout :: adminMenu}"></details>
    </div>
  </header>

  <section th:if="${success}" class="flash flash-success" th:text="${success}"></section>
  <section th:if="${error}" class="flash flash-error" th:text="${error}"></section>

  <table class="stripe">
    <thead>
    <tr>
      <th>Persoană</th>
      <th>Telefon</th>
      <th>Adresă</th>
      <th>Data vizitei</th>
      <th>Notițe</th>
      <th class="actions">Acțiuni</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="v : ${visits}">
      <td th:text="${v.personName != null and !#strings.isEmpty(v.personName) ? v.personName : '—'}"></td>
      <td th:text="${v.phone != null and !#strings.isEmpty(v.phone) ? v.phone : '—'}"></td>
      <td th:text="${v.address != null and !#strings.isEmpty(v.address) ? v.address : '—'}"></td>
      <td th:text="${v.visitDate != null ? v.visitDate : '—'}"></td>
      <td th:text="${v.notes != null and !#strings.isEmpty(v.notes) ? v.notes : '—'}"></td>
      <td class="actions">
        <a th:href="@{'/visits/' + ${v.id} + '/edit'}" class="link">Editează</a>
        <form th:action="@{'/visits/' + ${v.id} + '/delete'}" method="post" class="inline-form">
          <button type="submit" class="link danger">Șterge</button>
        </form>
      </td>
    </tr>
    <tr th:if="${visits.empty}">
      <td colspan="6" class="muted">Nu există vizite pentru moment.</td>
    </tr>
    </tbody>
  </table>

  <div class="pagination-bar">
    <a class="link-button" th:if="${page > 1}"
       th:href="@{/visits(size=${size != defaultSize ? size : null},page=${page - 1})}"
       data-i18n="pagination.previous">Anterior</a>
    <span class="pagination-info"
          th:text="${'Pagina ' + page + ' din ' + totalPages + ' (' + totalItems + ' înregistrări)'}"></span>
    <a class="link-button" th:if="${page < totalPages}"
       th:href="@{/visits(size=${size != defaultSize ? size : null},page=${page + 1})}"
       data-i18n="pagination.next">Următor</a>
    <form method="get" th:action="@{/visits}" class="pagination-controls">
      <input type="hidden" name="page" value="1" />
      <select name="size" onchange="this.form.submit()" aria-label="Număr rânduri">
        <option th:each="pageSize : ${pageSizes}" th:value="${pageSize}" th:text="${pageSize}" th:selected="${size == pageSize}"></option>
      </select>
    </form>
  </div>
</div>
</body>
</html>
