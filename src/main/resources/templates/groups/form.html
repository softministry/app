<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro" data-theme="light" th:attr="data-ui-theme=${headerUiTheme}">
<head>
  <meta charset="UTF-8" />
  <title th:text="${(headerActiveChurch != null and headerActiveChurch.name != null and !#strings.isEmpty(headerActiveChurch.name) ? headerActiveChurch.name + ' · ' : '') + (groupForm.id == null ? 'Adaugă grup' : 'Editează grup')}">Grup</title>
  <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
  <script defer th:src="@{/js/groups-form.js}"></script>
</head>
<body>
<div class="page-shell">
  <header class="page-header">
    <div>
      <p class="eyebrow">Organizare</p>
      <h1 th:text="${groupForm.id == null ? 'Adaugă grup' : 'Editează grup'}">Adaugă grup</h1>
    </div>
    <div class="header-actions">
      <nav th:replace="~{fragments/layout :: mainNav}"></nav>
      <form th:replace="~{fragments/layout :: churchSwitcher}"></form>
      <a th:href="@{/groups}" class="header-action-icon" aria-label="Înapoi" title="Înapoi">
        <span class="material-icons" aria-hidden="true">arrow_back</span>
      </a>
      <button th:replace="~{fragments/layout :: themeToggle}"></button>
      <details th:replace="~{fragments/layout :: adminMenu}"></details>
    </div>
  </header>

  <section th:if="${error}" class="flash flash-error" th:text="${error}"></section>

  <form th:object="${groupForm}"
        th:action="${groupForm.id == null ? '/groups' : '/groups/' + groupForm.id}"
        method="post"
        class="event-form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <input type="hidden" th:field="*{id}" />

    <section class="form-grid">
      <label>
        <span>Nume grup</span>
        <input type="text" th:field="*{name}" required />
      </label>
      <label>
        <span>Tip grup</span>
        <select th:field="*{type}">
          <option th:each="item : ${groupTypes}" th:value="${item}" th:text="${@uiLabels.groupType(item)}"></option>
        </select>
      </label>
      <label>
        <span>Lider</span>
        <select th:field="*{leaderId}">
          <option value="">—</option>
          <option th:each="person : ${allPersons}"
                  th:value="${person.id}"
                  th:text="${person.fullName != null and !#strings.isEmpty(#strings.trim(person.fullName)) ? #strings.trim(person.fullName) : 'Persoană fără nume'}"></option>
        </select>
      </label>
      <div class="group-member-picker">
        <div class="group-member-picker-header">
          <span class="field-label">Membri</span>
          <span class="group-member-count" data-member-count>0 selectați</span>
        </div>
        <div class="group-member-selected is-empty" data-member-selected>
          <span class="muted">Niciun membru selectat.</span>
        </div>
        <button type="button" class="button member-picker-open" data-member-picker-open>Alege membri</button>

        <div class="member-picker-modal" data-member-picker-modal hidden>
          <div class="member-picker-backdrop" data-member-picker-close></div>
          <section class="member-picker-panel" role="dialog" aria-modal="true" aria-labelledby="member-picker-title">
            <div class="member-picker-panel-header">
              <div>
                <p class="eyebrow">Grup</p>
                <h2 id="member-picker-title">Alege membri</h2>
              </div>
              <button type="button" class="icon-button" aria-label="Închide" data-member-picker-close>
                <span class="material-icons" aria-hidden="true">close</span>
              </button>
            </div>
            <input type="text"
                   class="group-member-search"
                   placeholder="Caută membru..."
                   autocomplete="off"
                   data-member-search />
            <div class="group-member-toolbar">
              <button type="button" class="member-picker-action" data-member-select-visible>Selectează rezultatele</button>
              <button type="button" class="member-picker-action" data-member-clear>Curăță selecția</button>
            </div>
            <div class="checkbox-list" data-member-list>
              <label th:each="person : ${allPersons}"
                     class="checkbox-inline checkbox-list-item"
                     th:attr="data-member-name=${person.fullName != null and !#strings.isEmpty(#strings.trim(person.fullName)) ? #strings.trim(person.fullName) : 'Persoană fără nume'},
                              data-member-id=${person.id}">
                <input type="checkbox"
                       th:field="*{memberIds}"
                       th:value="${person.id}" />
                <span th:text="${person.fullName != null and !#strings.isEmpty(#strings.trim(person.fullName)) ? #strings.trim(person.fullName) : 'Persoană fără nume'}">Persoană</span>
              </label>
              <p class="muted checkbox-list-empty is-hidden" data-member-empty>Nu am găsit membri pentru căutarea curentă.</p>
            </div>
            <div class="member-picker-footer">
              <span class="group-member-count" data-member-count-modal>0 selectați</span>
              <button type="button" class="button primary" data-member-picker-close>Aplică</button>
            </div>
          </section>
        </div>
      </div>
    </section>

    <label>
      <span>Descriere</span>
      <textarea th:field="*{description}" rows="4" placeholder="Scop, ritm întâlniri, observații..."></textarea>
    </label>

    <div class="form-actions">
      <button type="submit" class="button primary">Salvează</button>
      <a th:href="@{/groups}" class="link-button">Anulează</a>
    </div>
  </form>
</div>
</body>
</html>
