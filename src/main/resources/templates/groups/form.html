<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro" data-theme="light" th:attr="data-ui-theme=${headerUiTheme}">
<head>
  <meta charset="UTF-8" />
  <title th:text="${(headerActiveChurch != null and headerActiveChurch.name != null and !#strings.isEmpty(headerActiveChurch.name) ? headerActiveChurch.name + ' · ' : '') + (groupForm.id == null ? 'Adaugă grup' : 'Editează grup')}">Grup</title>
  <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
  <script defer th:src="@{/js/groups-form.js}"></script>
</head>
<body>
<div class="page-shell">
  <header class="page-header">
    <div>
      <p class="eyebrow">Organizare</p>
      <h1 th:text="${groupForm.id == null ? 'Adaugă grup' : 'Editează grup'}">Adaugă grup</h1>
    </div>
    <div class="header-actions">
      <nav th:replace="~{fragments/layout :: mainNav}"></nav>
      <form th:replace="~{fragments/layout :: churchSwitcher}"></form>
      <a th:href="@{/groups}" class="header-action-icon" aria-label="Înapoi" title="Înapoi">
        <span class="material-icons" aria-hidden="true">arrow_back</span>
      </a>
      <button th:replace="~{fragments/layout :: themeToggle}"></button>
      <details th:replace="~{fragments/layout :: adminMenu}"></details>
    </div>
  </header>

  <section th:if="${error}" class="flash flash-error" th:text="${error}"></section>

  <form th:object="${groupForm}"
        th:action="${groupForm.id == null ? '/groups' : '/groups/' + groupForm.id}"
        method="post"
        class="event-form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <input type="hidden" th:field="*{id}" />

    <section class="form-grid">
      <label>
        <span>Nume grup <span class="required-indicator">*</span></span>
        <input type="text" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'error'" required />
        <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
      </label>
      <label>
        <span>Tip grup <span class="required-indicator">*</span></span>
        <select th:field="*{type}" th:classappend="${#fields.hasErrors('type')} ? 'error'">
          <option th:each="item : ${groupTypes}" th:value="${item}" th:text="${@uiLabels.groupType(item)}"></option>
        </select>
        <span class="field-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></span>
      </label>
      <label>
        <span>Lider <span class="required-indicator">*</span></span>
        <select th:field="*{leaderId}" th:classappend="${#fields.hasErrors('leaderId')} ? 'error'" required>
          <option value="">—</option>
          <option th:each="person : ${allPersons}"
                  th:value="${person.id}"
                  th:text="${person.fullName != null and !#strings.isEmpty(#strings.trim(person.fullName)) ? #strings.trim(person.fullName) : 'Persoană fără nume'}"></option>
        </select>
        <span class="field-error" th:if="${#fields.hasErrors('leaderId')}" th:errors="*{leaderId}"></span>
      </label>
      <div class="group-member-picker">
        <div class="group-member-picker-header">
          <span class="field-label">Membri <span class="required-indicator">*</span></span>
          <span class="group-member-count" data-member-count>0 selectați</span>
        </div>
        <span class="field-error" th:if="${#fields.hasErrors('memberIds')}" th:errors="*{memberIds}"></span>
        <div class="group-member-selected is-empty" data-member-selected>
          <span class="muted">Niciun membru selectat.</span>
        </div>
        <button type="button" class="button member-picker-open" data-member-picker-open>Alege membri</button>

        <div class="member-picker-modal" data-member-picker-modal hidden>
          <div class="member-picker-backdrop" data-member-picker-close></div>
          <section class="member-picker-panel" role="dialog" aria-modal="true" aria-labelledby="member-picker-title">
            <div class="member-picker-panel-header">
              <div>
                <p class="eyebrow">Grup</p>
                <h2 id="member-picker-title">Alege membri</h2>
              </div>
              <button type="button" class="icon-button" aria-label="Închide" data-member-picker-close>
                <span class="material-icons" aria-hidden="true">close</span>
              </button>
            </div>
            <input type="text"
                   class="group-member-search"
                   placeholder="Caută membru..."
                   autocomplete="off"
                   data-member-search />
            <div class="group-member-toolbar">
              <button type="button" class="member-picker-action" data-member-select-visible>Selectează rezultatele</button>
              <button type="button" class="member-picker-action" data-member-clear>Curăță selecția</button>
            </div>
            <div class="checkbox-list" data-member-list>
              <label th:each="person : ${allPersons}"
                     class="checkbox-inline checkbox-list-item"
                     th:attr="data-member-name=${person.fullName != null and !#strings.isEmpty(#strings.trim(person.fullName)) ? #strings.trim(person.fullName) : 'Persoană fără nume'},
                              data-member-id=${person.id}">
                <input type="checkbox"
                       th:field="*{memberIds}"
                       th:value="${person.id}" />
                <span th:text="${person.fullName != null and !#strings.isEmpty(#strings.trim(person.fullName)) ? #strings.trim(person.fullName) : 'Persoană fără nume'}">Persoană</span>
              </label>
              <p class="muted checkbox-list-empty is-hidden" data-member-empty>Nu am găsit membri pentru căutarea curentă.</p>
            </div>
            <div class="member-picker-footer">
              <span class="group-member-count" data-member-count-modal>0 selectați</span>
              <button type="button" class="button primary" data-member-picker-close>Aplică</button>
            </div>
          </section>
        </div>
      </div>
    </section>

    <label>
      <span>Descriere</span>
      <textarea th:field="*{description}" th:classappend="${#fields.hasErrors('description')} ? 'error'" rows="4" placeholder="Scop, ritm întâlniri, observații..."></textarea>
      <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
    </label>

    <div class="form-actions">
      <button type="submit" class="button primary" id="submitButton">Salvează</button>
      <a th:href="@{/groups}" class="link-button">Anulează</a>
    </div>
    
    <script>
      // Client-side validation to prevent submission without required fields
      document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('.event-form');
        const nameInput = document.querySelector('input[name="name"]');
        const typeSelect = document.querySelector('select[name="type"]');
        const leaderSelect = document.querySelector('select[name="leaderId"]');
        const memberCheckboxes = document.querySelectorAll('input[name="memberIds"]');
        const submitButton = document.getElementById('submitButton');
        
        function validateForm() {
          const nameValid = nameInput && nameInput.value.trim().length >= 2;
          const typeValid = typeSelect && typeSelect.value !== '';
          const leaderValid = leaderSelect && leaderSelect.value !== '';
          const membersValid = Array.from(memberCheckboxes).some(cb => cb.checked);
          return nameValid && typeValid && leaderValid && membersValid;
        }
        
        function updateSubmitButton() {
          if (submitButton) {
            submitButton.disabled = !validateForm();
          }
        }
        
        // Initial check
        updateSubmitButton();
        
        // Listen for changes
        if (nameInput) {
          nameInput.addEventListener('input', updateSubmitButton);
          nameInput.addEventListener('blur', updateSubmitButton);
        }
        if (typeSelect) {
          typeSelect.addEventListener('change', updateSubmitButton);
        }
        if (leaderSelect) {
          leaderSelect.addEventListener('change', updateSubmitButton);
        }
        memberCheckboxes.forEach(function(checkbox) {
          checkbox.addEventListener('change', updateSubmitButton);
        });
        
        // Prevent form submission if invalid
        if (form) {
          form.addEventListener('submit', function(e) {
            if (!validateForm()) {
              e.preventDefault();
              alert('Vă rugăm să completați toate câmpurile obligatorii marcate cu *:\n- Nume grup\n- Tip grup\n- Lider\n- Cel puțin un membru');
              return false;
            }
          });
        }
      });
    </script>
  </form>
</div>
</body>
</html>
