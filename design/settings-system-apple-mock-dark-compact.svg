  <rect x="402" y="442" width="138" height="34" rx="10" fill="#1E293B"/><text x="434" y="464" fill="#93C5FD" font-family="SF Pro Text, -apple-system, sans-serif" font-size="13" font-weight="600">Export DB</text>
  <rect x="550" y="442" width="138" height="34" rx="10" fill="#1E293B"/><text x="580" y="464" fill="#93C5FD" font-family="SF Pro Text, -apple-system, sans-serif" font-size="13" font-weight="600">Export fresh</text>
  <text x="402" y="500" fill="#CBD5E1" font-family="SF Pro Text, -apple-system, sans-serif" font-size="14">Import archive</text>
  <rect x="402" y="508" width="820" height="38" rx="10" fill="#0B1220" stroke="#334155"/><text x="420" y="532" fill="#64748B" font-family="SF Pro Text, -apple-system, sans-serif" font-size="14">No file selected</text>
  <rect x="1234" y="508" width="128" height="38" rx="10" fill="#2563EB"/><text x="1278" y="532" fill="#FFFFFF" font-family="SF Pro Text, -apple-system, sans-serif" font-size="14" font-weight="600">Import</text>

  <rect x="376" y="572" width="1144" height="232" rx="14" fill="#111827" stroke="#334155"/>
  <text x="402" y="606" fill="#F1F5F9" font-family="SF Pro Display, -apple-system, sans-serif" font-size="20" font-weight="600">Desktop Runtime</text>
  <text x="402" y="628" fill="#94A3B8" font-family="SF Pro Text, -apple-system, sans-serif" font-size="14">Switch between production and testing database profiles</text>
  <text x="402" y="662" fill="#CBD5E1" font-family="SF Pro Text, -apple-system, sans-serif" font-size="14">Database mode</text>
  <rect x="402" y="670" width="340" height="40" rx="10" fill="#0B1220" stroke="#334155"/><text x="420" y="695" fill="#E2E8F0" font-family="SF Pro Text, -apple-system, sans-serif" font-size="15">PROD (current)</text>
  <rect x="402" y="720" width="690" height="34" rx="9" fill="#0B1220" stroke="#334155"/><circle cx="422" cy="737" r="7" fill="#3B82F6"/><text x="442" y="742" fill="#CBD5E1" font-family="SF Pro Text, -apple-system, sans-serif" font-size="14">Clone current DB into dev dataset on first switch</text>
  <rect x="402" y="764" width="266" height="36" rx="10" fill="#1E293B"/><text x="452" y="787" fill="#DBEAFE" font-family="SF Pro Text, -apple-system, sans-serif" font-size="13" font-weight="600">Apply DB mode (restart required)</text>
  <rect x="1254" y="764" width="266" height="36" rx="10" fill="#3F1D1D" stroke="#7F1D1D"/><text x="1320" y="787" fill="#FCA5A5" font-family="SF Pro Text, -apple-system, sans-serif" font-size="13" font-weight="600">Stop application</text>
