<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="cardShadow" x="0" y="0" width="2000" height="1300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect x="40" y="30" width="1520" height="62" rx="16" fill="#0F172A" stroke="#1F2937" filter="url(#cardShadow)"/>
  <text x="74" y="68" fill="#E2E8F0" font-family="SF Pro Display, -apple-system, sans-serif" font-size="24" font-weight="650">Settings</text>

  <rect x="40" y="106" width="280" height="844" rx="20" fill="#0F172A" stroke="#1F2937" filter="url(#cardShadow)"/>
  <text x="70" y="150" fill="#64748B" font-family="SF Pro Text, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">SECTIONS</text>
  <rect x="64" y="168" width="232" height="40" rx="12" fill="#111827"/><text x="92" y="193" fill="#94A3B8" font-family="SF Pro Text, -apple-system, sans-serif" font-size="15">Appearance</text>
  <rect x="64" y="216" width="232" height="40" rx="12" fill="#111827"/><text x="92" y="241" fill="#94A3B8" font-family="SF Pro Text, -apple-system, sans-serif" font-size="15">Church</text>
  <rect x="64" y="264" width="232" height="40" rx="12" fill="#111827"/><text x="92" y="289" fill="#94A3B8" font-family="SF Pro Text, -apple-system, sans-serif" font-size="15">Pastoral</text>
  <rect x="64" y="312" width="232" height="40" rx="12" fill="#172554"/><text x="92" y="337" fill="#93C5FD" font-family="SF Pro Text, -apple-system, sans-serif" font-size="15" font-weight="600">System</text>

  <rect x="336" y="106" width="1224" height="844" rx="20" fill="#0F172A" stroke="#1F2937" filter="url(#cardShadow)"/>
  <text x="376" y="152" fill="#F8FAFC" font-family="SF Pro Display, -apple-system, sans-serif" font-size="30" font-weight="700">System</text>
  <text x="376" y="176" fill="#94A3B8" font-family="SF Pro Text, -apple-system, sans-serif" font-size="15">Runtime and database controls for desktop deployments</text>

  <rect x="376" y="194" width="1144" height="186" rx="14" fill="#111827" stroke="#334155"/>
  <text x="402" y="228" fill="#F1F5F9" font-family="SF Pro Display, -apple-system, sans-serif" font-size="20" font-weight="600">General</text>
  <text x="402" y="262" fill="#CBD5E1" font-family="SF Pro Text, -apple-system, sans-serif" font-size="14">Default rows per page</text>
  <rect x="402" y="272" width="300" height="40" rx="10" fill="#0B1220" stroke="#334155"/><text x="420" y="297" fill="#E2E8F0" font-family="SF Pro Text, -apple-system, sans-serif" font-size="15">10</text>
  <rect x="402" y="322" width="530" height="34" rx="9" fill="#0B1220" stroke="#334155"/><circle cx="422" cy="339" r="7" fill="#3B82F6"/><text x="442" y="344" fill="#CBD5E1" font-family="SF Pro Text, -apple-system, sans-serif" font-size="14">Enable event tasks</text>
  <rect x="946" y="322" width="530" height="34" rx="9" fill="#0B1220" stroke="#334155"/><circle cx="966" cy="339" r="7" fill="#475569"/><text x="986" y="344" fill="#CBD5E1" font-family="SF Pro Text, -apple-system, sans-serif" font-size="14">Private mode</text>

  <rect x="376" y="394" width="1144" height="164" rx="14" fill="#111827" stroke="#334155"/>
