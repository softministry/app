<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">

  <!-- BACKGROUND -->
  <rect width="1400" height="900" fill="#F5F5F7"/>

  <!-- TITLE -->
  <text x="40" y="60" font-size="28" font-weight="600" fill="#1D1D1F">
    Ministry UI Library (Apple Style)
  </text>

  <!-- ================= BUTTON ================= -->
  <text x="40" y="120" font-size="16" fill="#6E6E73">Buttons</text>

  <rect x="40" y="140" width="180" height="44" rx="12" fill="#007AFF"/>
  <text x="130" y="168" text-anchor="middle" fill="white" font-size="14">Default</text>

  <rect x="240" y="140" width="180" height="44" rx="12" fill="#0A84FF"/>
  <text x="330" y="168" text-anchor="middle" fill="white" font-size="14">Hover</text>

  <rect x="440" y="140" width="180" height="44" rx="12" fill="#D1D1D6"/>
  <text x="530" y="168" text-anchor="middle" fill="white" font-size="14">Disabled</text>

  <!-- ================= INPUT ================= -->
  <text x="40" y="240" font-size="16" fill="#6E6E73">Inputs</text>

  <rect x="40" y="260" width="260" height="44" rx="10" fill="#FFFFFF" stroke="#E5E5EA"/>
  <text x="60" y="288" font-size="13" fill="#6E6E73">Default input</text>

  <rect x="320" y="260" width="260" height="44" rx="10" fill="#FFFFFF" stroke="#007AFF" stroke-width="2"/>
  <text x="340" y="288" font-size="13" fill="#1D1D1F">Focus input</text>

  <rect x="600" y="260" width="260" height="44" rx="10" fill="#FFFFFF" stroke="#FF3B30" stroke-width="2"/>
  <text x="620" y="288" font-size="13" fill="#FF3B30">Error input</text>

  <rect x="880" y="260" width="260" height="44" rx="10" fill="#F2F2F7"/>
  <text x="900" y="288" font-size="13" fill="#AEAEB2">Disabled</text>

  <!-- ================= TOGGLE ================= -->
  <text x="40" y="360" font-size="16" fill="#6E6E73">Toggle</text>

  <rect x="40" y="380" width="50" height="28" rx="14" fill="#D1D1D6"/>
  <circle cx="54" cy="394" r="11" fill="#FFFFFF"/>

  <rect x="140" y="380" width="50" height="28" rx="14" fill="#34C759"/>
  <circle cx="172" cy="394" r="11" fill="#FFFFFF"/>

  <rect x="240" y="380" width="50" height="28" rx="14" fill="#E5E5EA"/>
  <circle cx="254" cy="394" r="11" fill="#F2F2F7"/>

  <!-- ================= CHECKBOX ================= -->
  <text x="40" y="460" font-size="16" fill="#6E6E73">Checkbox</text>

  <rect x="40" y="480" width="20" height="20" rx="5" fill="#FFFFFF" stroke="#C7C7CC"/>

  <rect x="120" y="480" width="20" height="20" rx="5" fill="#007AFF"/>
  <path d="M125 490 L130 495 L138 485" stroke="white" stroke-width="2" fill="none"/>

  <rect x="200" y="480" width="20" height="20" rx="5" fill="#007AFF"/>
  <rect x="205" y="489" width="10" height="2" fill="white"/>

  <!-- ================= LIST ROW ================= -->
  <text x="40" y="560" font-size="16" fill="#6E6E73">List Row (Settings)</text>

  <text x="40" y="600" font-size="16" fill="#1D1D1F">Appearance</text>
  <text x="400" y="600" font-size="20" fill="#C7C7CC">›</text>

  <text x="40" y="640" font-size="16" fill="#1D1D1F">Rows per page</text>
  <text x="400" y="640" font-size="16" fill="#6E6E73">10</text>

  <text x="40" y="680" font-size="16" fill="#1D1D1F">Birthday Alerts</text>
  <rect x="360" y="660" width="50" height="28" rx="14" fill="#34C759"/>
  <circle cx="392" cy="674" r="11" fill="#FFFFFF"/>

  <!-- ================= CARDS ================= -->
  <text x="500" y="560" font-size="16" fill="#6E6E73">Cards</text>

  <rect x="500" y="580" width="220" height="120" rx="16" fill="#FFFFFF"/>
  <rect x="740" y="580" width="220" height="120" rx="16" fill="#FFFFFF" filter="drop-shadow(0px 6px 20px rgba(0,0,0,0.08))"/>
  <rect x="980" y="580" width="220" height="120" rx="16" fill="#F5F5F7"/>

</svg>