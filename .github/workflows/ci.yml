name: CI Pipeline

on:
  push:
    branches: [ main, master, develop, dev ]
  pull_request:
    branches: [ main, master, develop, dev ]

jobs:
  build:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Install ministryadmin-core dependency
        run: |
          # Check if manager-core directory exists and install it
          if [ -d "manager-core" ]; then
            cd manager-core
            mvn clean install -DskipTests
            cd ..
          else
            echo "Warning: manager-core directory not found. Skipping core installation."
            echo "Build may fail if ministryadmin-core dependency is required."
          fi
      
      - name: Build without tests
        run: mvn -B -DskipTests compile
        continue-on-error: true
      
      - name: Run unit tests with coverage
        run: mvn -B -Punit verify
        continue-on-error: true
      
      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7
      
      - name: Upload Surefire test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
      
      - name: Build JAR artifact
        run: mvn -B -Dmaven.test.skip=true package
        continue-on-error: true
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            target/*.jar
            target/*.jar.original
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    if: success() || failure()
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Install ministryadmin-core dependency
        run: |
          if [ -d "manager-core" ]; then
            cd manager-core
            mvn clean install -DskipTests
            cd ..
          fi
      
      - name: Run integration tests
        run: mvn -B -Pintegration verify
        continue-on-error: true
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
      
      - name: Upload Failsafe test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failsafe-reports
          path: target/failsafe-reports/
          retention-days: 7

  quality-gate:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [build, integration-tests]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          echo "Build result: ${{ needs.build.result }}"
          echo "Integration tests result: ${{ needs.integration-tests.result }}"
          
          if [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "✅ All quality gates passed"
            exit 0
          elif [ "${{ needs.build.result }}" == "failure" ] || [ "${{ needs.integration-tests.result }}" == "failure" ]; then
            echo "❌ Some jobs failed"
            exit 1
          else
            echo "⚠️ Some jobs were skipped or cancelled"
            exit 0
          fi